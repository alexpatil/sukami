services:
  sukami:
    build:
      context: .
      dockerfile: Dockerfile
    image: sukami:latest
    container_name: sukami-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - UPSTREAM_URL=https://api.openai.com/v1
      # Optional: Cloud Security Mode (lock down gateway on public cloud servers)
      # - SUKAMI_API_KEY=your-secure-master-key
      # Optional: default upstream fallback key (or pass dynamically via request headers)
      # - UPSTREAM_API_KEY=
