name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Go Backend Test & Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Run Go Vet
        run: go vet ./...
      - name: Run Go Unit & E2E Tests
        run: go test -v -race ./...
      - name: Build Binary
        run: go build -v -o bin/sukami ./cmd/sukami
